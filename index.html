<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firuz - Azərbaycan Əlifbası ilə Kriptoqrafiya</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 14px; margin-bottom: 4px; color: #94a3b8; }
        .input-group input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #fff; box-sizing: border-box; }
        button { margin: 4px 2px; padding: 8px 12px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card" style="max-width: 500px; margin: auto; padding: 20px;">
        <h1>Firuz Rzayev</h1>
        <p>İnformasiya Təhlükəsizliyi Tələbəsi</p>
        <hr>
        
        <h3>Azərbaycan Əlifbası ilə Kriptoqrafiya Paneli</h3>
        
        <div class="input-group">
            <label>Şifrələnəcək Mətn:</label>
            <input type="text" id="inputText" placeholder="Məs: BAKI, ƏLİNCƏ">
        </div>

        <div class="input-group">
            <label>Açar / Sürüşdürmə / Parametrlər:</label>
            <input type="text" id="keyInput" placeholder="Açar daxil edin (məs: 3, AÇAR, 31415 və ya 5,8)">
        </div>
        
        <div style="margin-top: 15px;">
            <button onclick="caesarCipher()">1. Sezar</button>
            <button onclick="vigenereCipher()">2. Vijener</button>
            <button onclick="gronsfeldCipher()">3. Qronsfeld</button>
            <button onclick="affineCipher()">4. Affin</button>
        </div>

        <div style="margin-top: 15px; text-align: left; background: #0f172a; padding: 10px; border-radius: 8px;">
            <p><b>Nəticə:</b> <span id="resultText" style="color: #4ade80; word-break: break-all;">-</span></p>
        </div>
    </div>

    <script>
        // Azərbaycan əlifbası (32 hərf - Modulo 32)
        const azAlphabet = ['A', 'B', 'C', 'Ç', 'D', 'E', 'Ə', 'F', 'G', 'Ğ', 'H', 'X', 'I', 'İ', 'J', 'K', 'Q', 'L', 'M', 'N', 'O', 'Ö', 'P', 'R', 'S', 'Ş', 'T', 'U', 'Ü', 'V', 'Y', 'Z'];
        const mod = azAlphabet.length;

        // Hərfin əlifbadakı indeksini tapan köməkçi funksiya
        function getIndex(char) {
            return azAlphabet.indexOf(char);
        }

        // 1. SEZAR ŞİFRƏSİ (Azərbaycan əlifbası ilə)
        function caesarCipher() {
            let text = document.getElementById("inputText").value.toUpperCase();
            let shift = parseInt(document.getElementById("keyInput").value) || 3;
            let result = "";

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let idx = getIndex(char);
                if (idx !== -1) {
                    let newIdx = (idx + shift) % mod;
                    if (newIdx < 0) newIdx += mod;
                    result += azAlphabet[newIdx];
                } else {
                    result += char; // Əlifbada olmayan simvolları olduğu kimi saxla
                }
            }
            document.getElementById("resultText").innerText = "Sezar (Sürüşmə: " + shift + "): " + result;
        }

        // 2. VİJENER ŞİFRƏSİ (Azərbaycan əlifbası ilə)
        function vigenereCipher() {
            let text = document.getElementById("inputText").value.toUpperCase();
            let key = document.getElementById("keyInput").value.toUpperCase() || "AÇAR";
            let result = "";
            let keyIndex = 0;

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let idx = getIndex(char);
                if (idx !== -1) {
                    let keyChar = key[keyIndex % key.length];
                    let shift = getIndex(keyChar);
                    if (shift === -1) shift = 0;

                    let newIdx = (idx + shift) % mod;
                    result += azAlphabet[newIdx];
                    keyIndex++;
                } else {
                    result += char;
                }
            }
            document.getElementById("resultText").innerText = "Vijener (Açar: " + key + "): " + result;
        }

        // 3. QRONSFELD ŞİFRƏSİ (Azərbaycan əlifbası ilə)
        function gronsfeldCipher() {
            let text = document.getElementById("inputText").value.toUpperCase();
            let keyStr = document.getElementById("keyInput").value || "31415";
            let result = "";
            let keyIndex = 0;

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let idx = getIndex(char);
                if (idx !== -1) {
                    let digit = parseInt(keyStr[keyIndex % keyStr.length]) || 0;
                    let newIdx = (idx + digit) % mod;
                    result += azAlphabet[newIdx];
                    keyIndex++;
                } else {
                    result += char;
                }
            }
            document.getElementById("resultText").innerText = "Qronsfeld (Açar: " + keyStr + "): " + result;
        }

        // 4. AFFİN ŞİFRƏSİ (Mod 32 üzrə)
        function affineCipher() {
            let text = document.getElementById("inputText").value.toUpperCase();
            let keyParts = document.getElementById("keyInput").value.split(',');
            let a = parseInt(keyParts[0]) || 5;
            let b = parseInt(keyParts[1]) || 8;
            let result = "";

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let idx = getIndex(char);
                if (idx !== -1) {
                    let newIdx = (a * idx + b) % mod;
                    result += azAlphabet[newIdx];
                } else {
                    result += char;
                }
            }
            document.getElementById("resultText").innerText = "Affin (a=" + a + ", b=" + b + "): " + result;
        }
    </script>
</body>
</html>
