<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firuz - Portfolio & Cryptography Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Firuz Rzayev</h1>
        <p>İnformasiya Təhlükəsizliyi Tələbəsi</p>
        <hr>
        
        <h3>Kriptoqrafik Alqoritm Demo (Caesar Cipher / AES Logic)</h3>
        <p>Mətni daxil edin və şifrələyin:</p>
        
        <input type="text" id="inputText" placeholder="Mətn daxil edin...">
        <button onclick="encryptText()">Şifrələ (Encrypt)</button>
        
        <p><b>Şifrələnmiş Mətn:</b> <span id="resultText" style="color: #4ade80;">-</span></p>
    </div>

    <script>
        function encryptText() {
            let text = document.getElementById("inputText").value;
            let encrypted = "";
            let shift = 3; // Kriptoqrafik Sürüşdürmə Açarı (Key)

            for (let i = 0; i < text.length; i++) {
                let charCode = text.charCodeAt(i);
                encrypted += String.fromCharCode(charCode + shift);
            }
            document.getElementById("resultText").innerText = encrypted;
        }
    </script>
</body>
</html>
